<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('ct-theme');
        var dark = t === 'dark' || ((t === null || t === 'system') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a11d3b" />
    <meta name="description" content="CherryTrack - Coffee Washing Station Management Platform" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CherryTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
